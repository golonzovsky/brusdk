[package]
name = "brusdk"
version = "0.1.0"
edition = "2024"
description = "Clean-room Rust driver for the Brady M511 label printer over BLE"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
btleplug = "0.13"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
